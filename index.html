<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ГРИБ: Тает Лёд</title>
<style>
  @font-face { font-family: 'px'; src: local('Courier'); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden; background:#0b0b14; font-family:'Press Start 2P', monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .quote {
    position:fixed; left:50%; transform:translateX(-50%);
    color:#ffe14d; font-weight:bold; font-size:clamp(14px,4vw,22px);
    text-shadow:0 0 8px #ff2d78, 2px 2px 0 #000;
    letter-spacing:1px; white-space:nowrap;
    animation:quotePop 1.6s ease-out forwards;
    font-family: monospace;
  }
  @keyframes quotePop {
    0% { opacity:0; transform:translateX(-50%) translateY(20px) scale(.6); }
    15% { opacity:1; transform:translateX(-50%) translateY(0) scale(1.1); }
    25% { transform:translateX(-50%) scale(1); }
    80% { opacity:1; }
    100% { opacity:0; transform:translateX(-50%) translateY(-40px); }
  }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,5,15,.82); color:#fff; text-align:center; padding:24px; gap:18px;
    font-family:monospace; backdrop-filter:blur(3px); z-index:10;
  }
  #overlay h1 {
    font-size:clamp(34px,10vw,64px); color:#7CFC00; letter-spacing:4px;
    text-shadow:0 0 18px #39ff14, 4px 4px 0 #1a4d00;
  }
  #overlay .sub { color:#ff2d78; font-size:clamp(13px,3.6vw,18px); text-shadow:2px 2px 0 #000; line-height:1.6; }
  #overlay .score { color:#ffe14d; font-size:clamp(18px,5vw,28px); }
  #overlay button {
    pointer-events:auto; font-family:monospace; font-weight:bold;
    font-size:clamp(16px,4.5vw,22px); padding:16px 36px; border:3px solid #7CFC00;
    background:#10241a; color:#7CFC00; letter-spacing:2px; cursor:pointer;
    box-shadow:0 0 16px rgba(124,252,0,.5), inset 0 0 12px rgba(124,252,0,.15);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse { 50% { box-shadow:0 0 30px rgba(124,252,0,.9), inset 0 0 12px rgba(124,252,0,.3); } }
  #overlay .hint { color:#8888aa; font-size:clamp(11px,3vw,14px); line-height:1.7; }
  #overlay .btnrow { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #overlay button.alt {
    border-color:#ff2d78; color:#ff2d78; background:#240f1a;
    box-shadow:0 0 16px rgba(255,45,120,.5), inset 0 0 12px rgba(255,45,120,.15);
    animation:pulseAlt 1.4s infinite;
  }
  @keyframes pulseAlt { 50% { box-shadow:0 0 30px rgba(255,45,120,.9), inset 0 0 12px rgba(255,45,120,.3); } }
  .record {
    color:#ffe14d; font-size:clamp(16px,4.5vw,24px); letter-spacing:2px;
    text-shadow:0 0 14px #ffd24d, 2px 2px 0 #000;
    animation:recordZoom .9s cubic-bezier(.2,2,.4,1) both, recordGlow 1s infinite alternate .9s;
  }
  @keyframes recordZoom { 0% { transform:scale(0) rotate(-8deg); } 100% { transform:scale(1) rotate(0); } }
  @keyframes recordGlow { from { text-shadow:0 0 8px #ffd24d,2px 2px 0 #000; } to { text-shadow:0 0 26px #ffec8a,2px 2px 0 #000; } }
  .confetti {
    position:fixed; top:-14px; pointer-events:none; z-index:11;
    animation:confFall linear forwards;
  }
  @keyframes confFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    85% { opacity:1; }
    100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
  }
  #hud {
    position:fixed; top:env(safe-area-inset-top,8px); left:0; right:0; padding:10px 14px;
    display:flex; justify-content:space-between; color:#fff; font-family:monospace;
    font-size:clamp(13px,3.8vw,18px); font-weight:bold; text-shadow:2px 2px 0 #000; z-index:5;
  }
  #combo { color:#ff2d78; }
  #slotBtn {
    position:fixed; bottom:calc(env(safe-area-inset-bottom,10px) + 14px); left:50%; transform:translateX(-50%);
    z-index:6; font-family:monospace; font-weight:bold; font-size:clamp(15px,4.2vw,20px);
    padding:12px 26px; border:3px solid #ff2d78; background:#240f1a; color:#ff2d78;
    letter-spacing:2px; cursor:pointer;
    box-shadow:0 0 16px rgba(255,45,120,.6), inset 0 0 12px rgba(255,45,120,.15);
    animation:pulseAlt 1.1s infinite;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud" class="hidden"><span id="score">0</span><span id="combo"></span></div>
<button id="slotBtn" class="hidden">🎰 КРУТИТЬ</button>
<div id="ui"></div>
<div id="overlay">
  <h1>ГРИБ</h1>
  <div class="sub">Марио прыгал на грибы.<br>Теперь гриб прыгает на сантехников.<br>Между нами тает лёд.</div>
  <button id="btn">ПОЕХАЛИ</button>
  <div class="hint">ТАП — прыжок &nbsp;•&nbsp; ТАП в воздухе — двойной<br>Прыгай НА врагов. Не дай себя пнуть.</div>
</div>
<script src="https://yourconscience.github.io/mushroom-data/zones.js?v=5"></script>
<script src="https://yourconscience.github.io/mushroom-data/bonuses.js?v=5"></script>
<script>
(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay'), btn = document.getElementById('btn');
const hud = document.getElementById('hud'), scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo');
const ui = document.getElementById('ui');

let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// --- Цитаты (отсылки) ---
const QUOTES = [
  'МЕЖДУ НАМИ ТАЕТ ЛЁД 🧊',          // Грибы — Тает лёд
  'ПАНЕЛЬКА, ХРУЩЁВКА 🏚',            // Хаски — Панелька
  'ЭТО ПРОСТО ДЫМ 💨',                // Скриптонит — Это дым
  'GIMME THE LOOT 💰',                // Big Baby Tape
  'ГОРОД ПОД ПОДОШВОЙ 👟',           // Oxxxymiron
  'I GOT LOVE ❤️',                    // Miyagi & Эндшпиль
  'НОВЫЙ КАДИЛЛАК 🚗',                // Morgenshtern
  'ВЕЧЕРИНКА У ДЕКСТЕРА 🎉',         // ЛСП x Oxxxymiron
  'МАЛО НАМ, МАЛО 🔥',                // Скриптонит
  'РОЗОВОЕ ВИНО 🍷',                  // Элджей & Feduk
  'ПЛАМБЕР ВЫШЕЛ ИЗ ЧАТА ☠️',
  'ЭЩКЕРЕ! 🗣',                       // Face
];
const DEATH_LINES = [
  'Это фиаско, братан.',
  'Между нами растаял ты.',
  'Тебя забрали в суп.',
  'Гриб откисает в панельке.',
  'Сантехник прочистил тебя.',
];

// --- Лидерборд ---
const LB_URL='https://kvdb.io/A2EYg5Q1vde6wu5QJEAnbe/';
async function fetchScores(){
  // _= обходит cloudflare-кеш kvdb (cache-control: public)
  const r=await fetch(LB_URL+'?values=true&format=json&_='+Date.now());
  const d=await r.json();
  // kvdb отдаёт массив пар [key, value]
  return d.map(it=>Array.isArray(it)?{n:it[0],s:+it[1]||0}:{n:it.key,s:+it.value||0})
          .sort((a,b)=>b.s-a.s);
}
let playerName=''; // выбирается один раз за визит
function pickName(){
  const def=localStorage.gribName||'ГРИБ';
  playerName=(prompt('Имя для лидерборда (до 8 букв):',def)||'').trim().slice(0,8);
  if(!playerName)playerName='АНОНИМ';
  localStorage.gribName=playerName;
}
async function submitScore(s){
  const name=playerName||'АНОНИМ';
  try{
    let scores=await fetchScores();
    const mine=scores.find(r=>r.n===name);
    if(!mine||s>mine.s){
      // POST с текстовым телом — простой запрос, без CORS preflight
      await fetch(LB_URL+encodeURIComponent(name),{method:'POST',body:String(s)});
      scores=scores.filter(r=>r.n!==name).concat({n:name,s}).sort((a,b)=>b.s-a.s);
    }
    return {scores,name};
  }catch(e){ return null; }
}

// Зоны: см. zones.js (ZONES, ZONE_LEN)

function showQuote(txt, big){
  const el=document.createElement('div'); el.className='quote'; el.textContent=txt;
  el.style.bottom=(H*0.32+Math.random()*H*0.1)+'px';
  if(big){ el.style.fontSize='clamp(18px,6vw,30px)'; el.style.color='#7CFC00'; }
  ui.appendChild(el); setTimeout(()=>el.remove(),1700);
}

// --- Звук (WebAudio пиканья) ---
let AC=null;
function beep(f,d,type='square',v=.12){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d); }
function sJump(){ beep(330,.12); setTimeout(()=>beep(520,.1),60); }
function sStomp(){ beep(620,.08); setTimeout(()=>beep(880,.12),50); }
function sDie(){ beep(220,.2,'sawtooth'); setTimeout(()=>beep(140,.35,'sawtooth'),120); }
function sJingle(z){ let d=0; for(const [f,dur] of z.jingle){ setTimeout(()=>beep(f,dur,z.wave,.16),d*1000); d+=dur; } }
// фоновый рифф зоны
let nextBeat=0, beatI=0;
function tickMusic(){
  if(!AC||!running||player.dead)return;
  const z=ZONES[zoneI], spb=60/z.bpm/2; // восьмые
  if(AC.currentTime>=nextBeat){
    const f=z.loop[beatI%z.loop.length];
    if(f)beep(f,spb*0.9,z.wave,.045);
    beatI++; nextBeat=Math.max(AC.currentTime,nextBeat)+spb;
  }
}

// --- Спецэффекты ---
let shakeT=0, shakeA=0, texts=[];
function shake(amp,dur){ shakeA=Math.max(shakeA,amp); shakeT=Math.max(shakeT,dur); }
function popText(x,y,txt,c){ texts.push({x,y,txt,c:c||'#ffe14d',l:0.9}); }
function firework(x,y){
  const hue=(Math.random()*360)|0;
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2, sp=180+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,l:.7+Math.random()*.4,c:'hsl('+((hue+i*9)%360)+',90%,65%)'});
  }
}
function confetti(n){
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='confetti';
    const s=6+Math.random()*8;
    d.style.left=(Math.random()*100)+'vw';
    d.style.width=s+'px'; d.style.height=(s*0.6)+'px';
    d.style.background='hsl('+((Math.random()*360)|0)+',90%,60%)';
    d.style.animationDuration=(1.8+Math.random()*2.2)+'s';
    d.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),4500);
  }
}

// --- Шер-карточка ---
let lastScores=null;
function buildShareCard(s,line){
  const c=document.createElement('canvas'); c.width=720; c.height=960;
  const x=c.getContext('2d');
  x.fillStyle='#0b0b14'; x.fillRect(0,0,720,960);
  for(let i=0;i<60;i++){ x.fillStyle='hsla('+((i*47)%360)+',85%,60%,'+(0.10+Math.random()*0.2)+')'; x.fillRect(Math.random()*720,Math.random()*960,4,7); }
  x.textAlign='center'; x.font='bold 76px monospace';
  x.shadowColor='#ff2d78'; x.shadowBlur=28; x.fillStyle='#ff2d78';
  x.fillText('RIP ГРИБ',360,150);
  x.shadowBlur=0; x.font='26px monospace'; x.fillStyle='#ff5c9a';
  x.fillText(line,360,225);
  x.font='bold 44px monospace'; x.fillStyle='#ffe14d';
  x.fillText('СЧЁТ: '+s,360,320);
  x.fillText('РЕКОРД: '+best,360,380);
  x.strokeStyle='#7CFC00'; x.lineWidth=4; x.shadowColor='#39ff14'; x.shadowBlur=18;
  x.strokeRect(220,430,280,76);
  x.font='bold 30px monospace'; x.fillStyle='#7CFC00'; x.fillText('ЕЩЁ РАЗ',360,480);
  x.shadowBlur=0;
  if(lastScores){
    x.font='bold 24px monospace'; x.fillStyle='#ffe14d'; x.fillText('ТОП-10 ГРИБОВ',360,580);
    x.font='24px monospace'; x.textAlign='left';
    lastScores.slice(0,10).forEach((r,i)=>{
      x.fillStyle=r.n===playerName?'#7CFC00':'#9a9ab8';
      x.fillText((i+1)+'. '+r.n+' — '+r.s,220,624+i*32);
    });
    x.textAlign='center';
  }
  x.font='20px monospace'; x.fillStyle='#55557a';
  x.fillText('ГРИБ: ТАЕТ ЛЁД 🍄',360,930);
  return c;
}
async function shareScore(s,line){
  const c=buildShareCard(s,line);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'rip-grib.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'ГРИБ',text:'Мой гриб набрал '+s+'. Это фиаско? '});
      return;
    }
  }catch(e){ if(e.name==='AbortError')return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rip-grib.png';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

// --- Состояние ---
let running=false, gameOver=false;
let player, plats, enemies, parts, pickups, camX, speed, score, combo, comboT, dist, tQuote, zoneI, zoneN, lap, jetT, boostT, best=+(localStorage.gribBest||0);
const G=2400, JUMP=-880;

function reset(){
  player={x:120,y:H*0.4,vx:0,vy:0,w:36,h:40,jumps:2,dead:false,squish:0};
  plats=[]; enemies=[]; parts=[]; pickups=[]; texts=[]; camX=0; speed=230; score=0; combo=0; comboT=0; dist=0; tQuote=0; zoneI=0; zoneN=0; lap=0; beatI=0; nextBeat=0; jetT=0; boostT=0; shakeT=0; shakeA=0; slotCharges=0; spinning=false; slotBtn.textContent='🎰 КРУТИТЬ'; slotBtn.classList.add('hidden');
  // стартовая земля
  plats.push({x:-100,y:H*0.72,w:900});
  let x=800;
  while(x<3000){ x=addPlat(x); }
  gameOver=false;
}
function addPlat(afterX){
  const gap=60+Math.random()*100+speed*0.08;
  const w=200+Math.random()*260;
  const last=plats[plats.length-1];
  let y=last.y+(Math.random()*220-110);
  y=Math.max(H*0.35,Math.min(H*0.82,y));
  const p={x:afterX+gap,y,w};
  plats.push(p);
  // враг
  if(Math.random()<0.45+lap*0.1 && w>150){
    const types=ZONES[zoneI].enemies;
    const type=types[(Math.random()*types.length)|0];
    enemies.push({x:p.x+w*0.5,y:p.y,w:34,h:42,dir:Math.random()<.5?-1:1,p,dead:0,t:Math.random()*6,type,vy:0,baseY:p.y});
  }
  // бонус
  const roll=Math.random(); let acc=0;
  for(const k in BONUSES){
    acc+=BONUSES[k].chance;
    if(roll<acc){ pickups.push({x:p.x+w*(0.2+Math.random()*0.6),y:p.y-52,kind:k,t:Math.random()*6}); break; }
  }
  return p.x+w;
}

// --- Ввод ---
function jump(){
  if(!running){ return; }
  if(player.dead) return;
  if(player.jumps>0||jetT>0){
    player.vy=jetT>0?JUMP*0.75:JUMP*(player.jumps===2?1:0.88);
    if(jetT<=0)player.jumps--;
    player.squish=-0.25; sJump();
    for(let i=0;i<6;i++) parts.push({x:player.x,y:player.y,vx:(Math.random()-.5)*200,vy:100+Math.random()*100,l:.4,c:'#9be564'});
  }
}
addEventListener('pointerdown',e=>{ if(e.target.tagName!=='BUTTON') jump(); });
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp') jump(); });

btn.addEventListener('click',()=>{
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(!playerName) pickName();
  reset(); running=true; overlay.classList.add('hidden'); hud.classList.remove('hidden');
});

// --- Слот-машина ---
const slotBtn=document.getElementById('slotBtn');
let slotCharges=0, spinning=false;
const SLOT_REELS=['🍒','🍋','🍄','💀','💰','7️⃣'];
function applySlot(k){
  switch(k){
    case 'jackpot': score+=2000; confetti(60); break;
    case 'double':  score*=2; confetti(40); break;
    case 'lose':    score=Math.max(0,score-500); shake(8,.3); break;
    case 'wipe':
      for(const e of enemies){
        if(!e.dead&&e.x>camX&&e.x<camX+W){ e.dead=0.01; score+=100; firework(e.x,e.y-40); }
      }
      shake(10,.4); break;
    case 'slow':    speed=Math.max(200,speed-120); break;
    case 'rush':    speed=Math.min(560,speed+100); boostT=4; score+=1500; break;
    case 'jet':     jetT=6; break;
    case 'none':    break;
  }
}
function spinSlot(){
  if(spinning||slotCharges<=0||!running||player.dead)return;
  spinning=true; slotCharges--;
  let n=0;
  const iv=setInterval(()=>{
    slotBtn.textContent=SLOT_REELS[(Math.random()*6)|0]+SLOT_REELS[(Math.random()*6)|0]+SLOT_REELS[(Math.random()*6)|0];
    beep(300+n*40,.05,'square',.08); n++;
    if(n>=12){
      clearInterval(iv);
      const o=SLOT_OUTCOMES[(Math.random()*SLOT_OUTCOMES.length)|0];
      applySlot(o.k);
      showQuote(o.t,true);
      beep(880,.15); setTimeout(()=>beep(1175,.2),120);
      if(navigator.vibrate)navigator.vibrate([40,30,60]);
      slotBtn.textContent='🎰 КРУТИТЬ';
      if(slotCharges<=0)slotBtn.classList.add('hidden');
      spinning=false;
    }
  },90);
}
slotBtn.addEventListener('click',spinSlot);

// --- Фон: панельки ---
// детерминированный псевдошум по целому сиду — фон не мерцает
function rnd(n){ n=(n*374761393+1)|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }

function drawBuildings(Z){
  // окна сидируются мировым индексом дома — параллакс едет, паттерн стабилен
  for(let layer=0;layer<2;layer++){
    const par=(layer+1)*0.15, bw=100+layer*50, sp=bw+34;
    const first=Math.floor(camX*par/sp)-1, count=Math.ceil(W/sp)+2;
    for(let k=first;k<first+count;k++){
      const bx=k*sp-camX*par, bh=H*(0.28+rnd(k*7+layer*131)*0.3);
      ctx.fillStyle=layer?Z.build2:Z.build;
      ctx.fillRect(bx,H-bh,bw,bh);
      let wyI=0;
      for(let wy=H-bh+14;wy<H-20;wy+=28,wyI++){
        let wxI=0;
        for(let wx=bx+10;wx<bx+bw-14;wx+=24,wxI++){
          if(rnd(k*1009+wyI*61+wxI*17+layer)<0.18){
            ctx.fillStyle=Z.win; ctx.fillRect(wx,wy,10,13);
          }
        }
      }
    }
  }
}
function drawBg(t){
  const Z=ZONES[zoneI||0];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,Z.sky[0]); g.addColorStop(.6,Z.sky[1]); g.addColorStop(1,Z.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  switch(Z.bg){
    case 'city':
      ctx.fillStyle=Z.moon; ctx.beginPath(); ctx.arc(W*0.8,H*0.16,32,0,7); ctx.fill();
      ctx.fillStyle=Z.sky[0]; ctx.beginPath(); ctx.arc(W*0.8+11,H*0.16-5,27,0,7); ctx.fill();
      drawBuildings(Z);
      break;
    case 'sunset':{
      ctx.fillStyle=Z.moon; ctx.beginPath(); ctx.arc(W*0.5,H*0.5,H*0.18,0,7); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.18)';
      for(let i=0;i<5;i++){
        const cy=H*0.5-H*0.18+i*H*0.072+4;
        ctx.fillRect(0,cy,W,5+i*2);
      }
      drawBuildings(Z);
      break;}
    case 'snow':
      for(let n=0;n<70;n++){
        const sx=(rnd(n)*W+t*(14+rnd(n+500)*22))%W;
        const sy=(rnd(n+1000)*H+t*(36+rnd(n+1500)*40))%H;
        ctx.fillStyle='rgba(230,248,255,'+(0.35+rnd(n+2000)*0.4)+')';
        ctx.fillRect(sx,sy,2.5,2.5);
      }
      break;
    case 'fog':
      ctx.fillStyle=Z.moon; ctx.beginPath(); ctx.arc(W*0.78,H*0.14,26,0,7); ctx.fill();
      for(let n=0;n<6;n++){
        const fx=((rnd(n+30)*W*1.5+t*(8+n*3))%(W*1.5))-W*0.25;
        const fy=H*(0.25+rnd(n+60)*0.55);
        ctx.fillStyle='rgba(160,180,140,0.07)';
        ctx.beginPath(); ctx.ellipse(fx,fy,W*0.3,H*0.07,0,0,7); ctx.fill();
      }
      break;
    case 'rain':
      drawBuildings(Z);
      ctx.strokeStyle='rgba(150,170,210,0.30)'; ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let n=0;n<46;n++){
        const rx=(rnd(n)*W+t*(380+rnd(n+99)*160))%(W+60)-30;
        const ry=(rnd(n+200)*H+t*(620+rnd(n+300)*200))%H;
        ctx.moveTo(rx,ry); ctx.lineTo(rx-7,ry+16);
      }
      ctx.stroke();
      break;
    case 'gold':
      for(let n=0;n<36;n++){
        const gx=rnd(n)*W, gy=rnd(n+700)*H*0.8;
        const tw=0.25+0.75*Math.abs(Math.sin(t*1.4+n*1.7));
        ctx.fillStyle='rgba(255,210,77,'+(tw*0.7)+')';
        const s=1.5+rnd(n+900)*2.5;
        ctx.fillRect(gx-s/2,gy-s/2,s,s);
      }
      break;
    case 'space':
      for(let n=0;n<90;n++){
        ctx.fillStyle='rgba(255,255,255,'+(0.25+rnd(n+40)*0.6)+')';
        ctx.fillRect(rnd(n)*W,rnd(n+400)*H,1.6,1.6);
      }
      ctx.fillStyle='#3a6ea5'; ctx.beginPath(); ctx.arc(W*0.82,H*0.18,26,0,7); ctx.fill();
      ctx.fillStyle='#4caf78'; ctx.beginPath(); ctx.arc(W*0.81,H*0.17,26,1.1,2.6); ctx.fill();
      break;
    case 'party':{
      const hue=(t*40)%360;
      ctx.fillStyle='hsla('+hue+',80%,55%,0.05)'; ctx.fillRect(0,0,W,H);
      for(let n=0;n<40;n++){
        const cx=(rnd(n)*W+t*(10+rnd(n+5)*20))%W;
        const cy=(rnd(n+100)*H+t*(60+rnd(n+200)*70))%H;
        ctx.fillStyle='hsla('+((n*47)%360)+',85%,65%,0.7)';
        ctx.fillRect(cx,cy,3.5,5);
      }
      break;}
  }
}

// --- Рисовка гриба ---
function drawGrib(p,t){
  ctx.save(); ctx.translate(p.x-camX,p.y);
  const sq=p.squish; ctx.scale(1-sq*.6,1+sq);
  // ножка
  ctx.fillStyle='#f5e9d0'; ctx.fillRect(-10,-18,20,18);
  // глаза
  ctx.fillStyle='#222'; ctx.fillRect(-7,-14,4,6); ctx.fillRect(3,-14,4,6);
  // шляпка
  ctx.fillStyle='#e63946';
  ctx.beginPath(); ctx.ellipse(0,-20,20,13,0,Math.PI,0); ctx.fill();
  ctx.fillRect(-20,-20,40,4);
  // точки
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-8,-26,3.4,0,7); ctx.arc(8,-25,3,0,7); ctx.arc(0,-30,2.6,0,7); ctx.fill();
  ctx.restore();
}
// --- Враги ---
const SKINS={
  walk: {cap:'#d62828', body:'#2a5fd0', letter:'М'},
  slide:{cap:'#4cc9f0', body:'#1b3b5e', letter:'Л'},
  hop:  {cap:'#ffd700', body:'#7a0f3f', letter:'$'},
};
function drawEnemy(e,t){
  ctx.save(); ctx.translate(e.x-camX,e.y);
  if(e.dead){ ctx.scale(1,0.25); ctx.globalAlpha=Math.max(0,1-e.dead*2); }
  ctx.scale(e.dir,1);
  if(e.type==='fly'){
    // голубь
    const flap=Math.sin(t*16+e.t)*9;
    ctx.fillStyle='#9a9aae';
    ctx.beginPath(); ctx.ellipse(0,-14,15,10,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(13,-22,7,0,7); ctx.fill();
    ctx.fillStyle='#ff8c42'; ctx.fillRect(19,-23,7,3);
    ctx.fillStyle='#222'; ctx.fillRect(14,-25,3,3);
    ctx.fillStyle='#6e6e85';
    ctx.beginPath(); ctx.moveTo(-4,-16); ctx.lineTo(-14,-26-flap); ctx.lineTo(4,-18); ctx.fill();
    ctx.fillStyle='#4cc9f0'; ctx.fillRect(-3,-9,4,4);
    ctx.restore(); return;
  }
  const sk=SKINS[e.type]||SKINS.walk;
  const bob=e.type==='hop'?0:Math.sin(t*10+e.t)*2;
  ctx.fillStyle=sk.body; ctx.fillRect(-12,-26+bob,24,26-bob);
  ctx.fillStyle='#f0b27a'; ctx.fillRect(-10,-38+bob,20,14);
  ctx.fillStyle='#3d2b1f'; ctx.fillRect(-9,-29+bob,18,4);
  ctx.fillStyle=sk.cap; ctx.fillRect(-12,-44+bob,24,8); ctx.fillRect(2,-42+bob,16,5);
  ctx.fillStyle=e.type==='hop'?'#000':'#fff'; ctx.font='bold 8px monospace'; ctx.fillText(sk.letter,-4,-37+bob);
  ctx.fillStyle='#8d5a2b'; ctx.fillRect(13,-24+bob,3,18);
  ctx.fillStyle='#c1121f'; ctx.fillRect(9,-8+bob,11,6);
  ctx.restore();
}

// --- Цикл ---
let lt=0;
function loop(ts){
  requestAnimationFrame(loop);
  const t=ts/1000, dt=Math.min((ts-lt)/1000,0.033); lt=ts;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0){ shakeT-=dt; const a=shakeA*Math.min(1,shakeT*4); ctx.translate((Math.random()-.5)*2*a,(Math.random()-.5)*2*a); if(shakeT<=0)shakeA=0; }
  drawBg(t);
  if(!running){ return; }

  if(!player.dead){
    jetT=Math.max(0,jetT-dt); boostT=Math.max(0,boostT-dt);
    speed=Math.min(560,speed+dt*3); dist+=speed*dt;
    player.x+=speed*(boostT>0?1.6:1)*dt;
    // гриб ближе к левому краю — впереди видно больше
    camX=player.x-Math.min(100,W*0.16);
    // смена зоны: все 8 по разу, дальше круг II, III... с ускорением
    const zn=(dist/ZONE_LEN)|0;
    if(zn!==zoneN){
      zoneN=zn; zoneI=zn%ZONES.length; lap=(zn/ZONES.length)|0;
      speed+=10;
      const Z=ZONES[zoneI];
      const mark=lap?' '+(['II','III','IV','V','VI'][lap-1]||'∞'):'';
      showQuote('ЗОНА: '+Z.name+mark+' • '+Z.sub, true);
      sJingle(Z);
    }
  }
  tickMusic();
  // физика
  player.vy+=G*dt; player.y+=player.vy*dt;
  player.squish+= (0-player.squish)*Math.min(1,dt*10);

  // платформы
  let onGround=false;
  for(const p of plats){
    if(player.x>p.x-14&&player.x<p.x+p.w+14&&player.vy>=0&&player.y>=p.y-6&&player.y<=p.y+Math.max(26,player.vy*dt+8)){
      player.y=p.y; player.vy=0; if(player.jumps<2&&!onGround){ player.squish=0.22; } player.jumps=2; onGround=true;
    }
  }
  if(onGround) { combo>0&&(comboT-=dt); if(comboT<=0) combo=0; }

  // генерация/чистка
  while(plats[plats.length-1].x<camX+W*2.5) addPlat(plats[plats.length-1].x+plats[plats.length-1].w);
  plats=plats.filter(p=>p.x+p.w>camX-200);
  enemies=enemies.filter(e=>e.x>camX-200&&e.dead<1);
  pickups=pickups.filter(b=>b.x>camX-100);

  // подбор бонусов
  for(const b of pickups){
    if(player.dead||b.got)continue;
    if(Math.abs(player.x-b.x)<32&&Math.abs(player.y-20-b.y)<44){
      b.got=true;
      const B=BONUSES[b.kind];
      showQuote(B.quote,true);
      beep(700,.08); setTimeout(()=>beep(1050,.12),60);
      if(navigator.vibrate)navigator.vibrate(40);
      shake(3,.15); popText(b.x,b.y-30,B.icon+(b.kind==='loot'?' +500':''),B.color);
      if(b.kind==='jet')jetT=B.dur;
      else if(b.kind==='boost')boostT=B.dur;
      else if(b.kind==='loot')score+=500;
      else if(b.kind==='slot'){ slotCharges++; slotBtn.classList.remove('hidden'); }
      for(let i=0;i<14;i++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*450,vy:-Math.random()*350,l:.6,c:B.color});
    }
  }
  pickups=pickups.filter(b=>!b.got);

  // враги
  const emult=ZONES[zoneI].mult*(1+lap*0.25);
  for(const e of enemies){
    if(e.dead){ e.dead+=dt; continue; }
    const sp=(e.type==='slide'?150:e.type==='fly'?85:e.type==='hop'?70:60)*emult;
    e.x+=e.dir*sp*dt;
    if(e.x<e.p.x+18){e.dir=1;} if(e.x>e.p.x+e.p.w-18){e.dir=-1;}
    if(e.type==='fly'){
      e.y=e.baseY-58+Math.sin(t*3+e.t)*24;
    } else if(e.type==='hop'){
      e.vy+=G*0.7*dt; e.y+=e.vy*dt;
      if(e.y>=e.baseY){ e.y=e.baseY; e.vy=-620; }
    }
    // коллизия
    if(!player.dead&&Math.abs(player.x-e.x)<26&&player.y>e.y-44&&player.y-40<e.y){
      if(player.vy>140&&player.y<e.y-14){
        // СТОМП
        e.dead=0.01; player.vy=JUMP*0.7; player.jumps=2;
        combo++; comboT=2.2;
        const pts=100*combo; score+=pts; sStomp();
        popText(e.x,e.y-60,'+'+pts, combo>1?'#ff2d78':'#ffe14d');
        shake(3+Math.min(combo*1.5,8),.18);
        if(combo>=3) firework(e.x,e.y-80);
        showQuote(QUOTES[(Math.random()*QUOTES.length)|0], combo>=3);
        if(navigator.vibrate)navigator.vibrate(30);
        for(let i=0;i<12;i++)parts.push({x:e.x,y:e.y-20,vx:(Math.random()-.5)*400,vy:-Math.random()*300,l:.6,c:Math.random()<.5?'#d62828':'#2a5fd0'});
      } else if(boostT>0){
        // на бусте сносим врага корпусом
        e.dead=0.01; combo++; comboT=2.2; score+=100*combo; sStomp();
        for(let i=0;i<12;i++)parts.push({x:e.x,y:e.y-20,vx:(Math.random()-.5)*500,vy:-Math.random()*300,l:.5,c:'#ffd700'});
      } else if(!player.dead){ die(); }
    }
  }

  // падение
  if(!player.dead&&player.y>H+80) die();

  score+=speed*dt*0.05;

  // частицы
  for(const p of parts){ p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=1200*dt; }
  parts=parts.filter(p=>p.l>0);

  // --- рендер мира ---
  const ZC=ZONES[zoneI];
  for(const p of plats){
    const px=p.x-camX;
    ctx.fillStyle=ZC.plat; ctx.fillRect(px,p.y,p.w,8);
    ctx.fillStyle=ZC.dirt; ctx.fillRect(px,p.y+8,p.w,16);
    ctx.fillStyle=ZC.dirt2; ctx.fillRect(px,p.y+24,p.w,Math.max(0,H-p.y-24));
  }
  // бонусы (парят и пульсируют)
  ctx.textAlign='center';
  for(const b of pickups){
    const by=b.y+Math.sin(t*3+b.t)*6, B=BONUSES[b.kind];
    ctx.save(); ctx.translate(b.x-camX,by);
    ctx.globalAlpha=.25; ctx.fillStyle=B.color;
    ctx.beginPath(); ctx.arc(0,0,20+Math.sin(t*6+b.t)*3,0,7); ctx.fill();
    ctx.globalAlpha=1; ctx.font='22px monospace'; ctx.fillText(B.icon,0,8);
    ctx.restore();
  }
  ctx.textAlign='left';
  // выхлоп джетпака / буста
  if(jetT>0&&!player.dead)parts.push({x:player.x-8,y:player.y-6,vx:-120-Math.random()*80,vy:120+Math.random()*120,l:.35,c:Math.random()<.5?'#ff8c42':'#4cc9f0'});
  if(boostT>0&&!player.dead)parts.push({x:player.x-14,y:player.y-18,vx:-300,vy:(Math.random()-.5)*80,l:.3,c:'#ffd700'});
  for(const e of enemies) drawEnemy(e,t);
  for(const p of parts){ ctx.globalAlpha=Math.min(1,p.l*2); ctx.fillStyle=p.c; ctx.fillRect(p.x-camX-3,p.y-3,6,6); ctx.globalAlpha=1; }
  // всплывающие очки
  ctx.textAlign='center'; ctx.font='bold 22px monospace';
  for(const tx of texts){
    tx.l-=dt; tx.y-=70*dt;
    ctx.globalAlpha=Math.min(1,tx.l*2.5); ctx.fillStyle=tx.c;
    ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeText(tx.txt,tx.x-camX,tx.y);
    ctx.fillText(tx.txt,tx.x-camX,tx.y); ctx.globalAlpha=1;
  }
  texts=texts.filter(tx=>tx.l>0);
  ctx.textAlign='left';
  if(!player.dead||player.y<H+200) drawGrib(player,t);

  scoreEl.textContent='СЧЁТ: '+(score|0);
  const fx=jetT>0?('🚀'+jetT.toFixed(0)+' '):boostT>0?('🏎'+boostT.toFixed(0)+' '):'';
  comboEl.textContent=fx+(combo>1?('x'+combo+' КОМБО'):'');
}
requestAnimationFrame(loop);

function die(){
  if(player.dead)return;
  player.dead=true; player.vy=-500; sDie(); shake(14,.5);
  if(navigator.vibrate)navigator.vibrate([60,40,80]);
  setTimeout(()=>{
    running=false; hud.classList.add('hidden'); slotBtn.classList.add('hidden');
    const s=score|0;
    const newRecord=s>best&&s>0;
    best=Math.max(best,s); localStorage.gribBest=best;
    const line=DEATH_LINES[(Math.random()*DEATH_LINES.length)|0];
    overlay.innerHTML=`<h1 style="color:#ff2d78;text-shadow:0 0 18px #ff2d78,4px 4px 0 #4d0022">RIP ГРИБ</h1>
      <div class="sub">${line}</div>
      ${newRecord?'<div class="record">🏆 НОВЫЙ РЕКОРД! 🏆</div>':''}
      <div class="score">СЧЁТ: ${s}<br>РЕКОРД: ${best}</div>
      <div class="btnrow">
        <button id="btn2">ЕЩЁ РАЗ</button>
        <button id="btnShare" class="alt">ШЕРАНУТЬ 📸</button>
      </div>
      <div id="lbx" class="hint">лидерборд грузится…</div>`;
    overlay.classList.remove('hidden');
    confetti(newRecord?120:45);
    if(newRecord){ sJingle(ZONES[0]); }
    document.getElementById('btn2').onclick=()=>{ reset(); running=true; overlay.classList.add('hidden'); hud.classList.remove('hidden'); };
    document.getElementById('btnShare').onclick=()=>shareScore(s,line);
    submitScore(s).then(res=>{
      const el=document.getElementById('lbx'); if(!el)return;
      if(!res){ el.textContent='лидерборд недоступен (нет сети)'; return; }
      lastScores=res.scores;
      const rows=res.scores.slice(0,10).map((r,i)=>{
        const me=r.n===res.name?' style="color:#7CFC00"':'';
        return `<div${me}>${String(i+1).padStart(2,' ')}. ${r.n} — ${r.s}</div>`;
      }).join('');
      el.innerHTML=`<div style="color:#ffe14d;margin-bottom:6px">ТОП-10 ГРИБОВ</div><div style="text-align:left;display:inline-block">${rows}</div>`;
    });
  },900);
}
})();
</script>
